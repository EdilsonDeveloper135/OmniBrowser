name: Feature request
description: Propón una mejora compatible con el modelo local-first.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Antes de proponer una nueva funcionalidad, consulte [`docs/architecture.md`](../../docs/architecture.md) y los registros de decisiones arquitectónicas en [`docs/adr/`](../../docs/adr/).
        OmniBrowser sigue un modelo estrictamente local-first (sin nube, sin cuentas remotas ni telemetría).
  - type: textarea
    id: problem
    attributes:
      label: Problema
      description: ¿Qué necesidad concreta no resuelve hoy OmniBrowser?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Propuesta
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Impacto en perfiles, privacidad o permisos
      description: Indica si toca sesiones, IPC, persistencia, navegación o APIs del sistema.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas consideradas
