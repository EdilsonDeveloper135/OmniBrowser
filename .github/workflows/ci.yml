name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-13
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use pinned Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Select the active macOS SDK
        run: echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Use Python for the agent sidecar
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install exact dependencies
        run: npm ci

      - name: Verify types, lint and units
        run: npm run verify

      - name: Run Electron proof-of-concepts
        run: npm run test:poc
        env:
          OMNIBROWSER_REQUIRE_COMPOSITE_CAPTURE: '1'

      - name: Test the agent sidecar protocol
        run: npm run agent:test

      - name: Build the Browser Use sidecar
        run: npm run agent:build

      - name: Trace Browser Use through the scoped CDP gateway
        run: npm run agent:compat
        env:
          OMNIBROWSER_AGENT_PYTHON: agent-runtime/.venv-${{ matrix.arch }}/bin/python

      - name: Build packaged application
        run: npm run package -- --arch=${{ matrix.arch }}

      - name: Verify the packaged application
        shell: bash
        run: |
          app_path="out/OmniBrowser-darwin-${{ matrix.arch }}/OmniBrowser.app"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")" = "org.omnibrowser.desktop"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app_path/Contents/Info.plist")" = "13.0"
          npm exec -- electron-fuses read --app "$app_path" | tee /tmp/omnibrowser-fuses.txt
          grep -q 'RunAsNode is Disabled' /tmp/omnibrowser-fuses.txt
          grep -q 'EnableCookieEncryption is Enabled' /tmp/omnibrowser-fuses.txt
          grep -q 'EnableNodeOptionsEnvironmentVariable is Disabled' /tmp/omnibrowser-fuses.txt
          grep -q 'EnableNodeCliInspectArguments is Disabled' /tmp/omnibrowser-fuses.txt
          grep -q 'EnableEmbeddedAsarIntegrityValidation is Enabled' /tmp/omnibrowser-fuses.txt
          grep -q 'OnlyLoadAppFromAsar is Enabled' /tmp/omnibrowser-fuses.txt
          grep -q 'GrantFileProtocolExtraPrivileges is Disabled' /tmp/omnibrowser-fuses.txt
          sidecar="$app_path/Contents/Resources/agent-host/agent-host"
          test -x "$sidecar"
          file -b "$sidecar" | grep -q "${{ matrix.arch == 'x64' && 'x86_64' || 'arm64' }}"
          "$sidecar" --self-check

      - name: Report the virtual display
        run: system_profiler SPDisplaysDataType | grep -E 'Resolution|Looks like|Main Display' || true

      - name: Run Electron end-to-end suite
        run: npm run test:e2e:only
        env:
          OMNIBROWSER_REQUIRE_AGENT_E2E: '1'

      - name: Upload end-to-end evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-${{ matrix.arch }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit runtime dependencies
        run: npm audit --omit=dev
