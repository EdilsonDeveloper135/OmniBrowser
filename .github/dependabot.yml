version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      electron-forge:
        patterns:
          - "@electron-forge/*"
      lint-and-test:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "vitest"
          - "@playwright/test"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
